<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Пользователи — Админ')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div class="studio">
            <nav th:replace="~{fragments/panels :: adminNav}"></nav>
            <div>
                <div class="page-head"><div><h1 class="page-title">Пользователи</h1><p class="page-sub" th:text="'Всего: ' + ${users.totalElements}"></p></div></div>
                <form class="toolbar" th:action="@{/admin/users}" method="get">
                    <input class="input" name="q" th:value="${q}" placeholder="Имя, логин или email">
                    <button class="btn" type="submit"><i data-lucide="search"></i>Найти</button>
                </form>
                <div class="table-wrap">
                    <table class="table">
                        <thead><tr><th>Пользователь</th><th>Email</th><th>Роль</th><th>Статус</th><th class="num">Подписчики</th><th>Регистрация</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td><a class="table-video" style="min-width:220px" th:href="@{/channel/{n}(n=${u.username})}">
                                <th:block th:replace="~{fragments/layout :: avatar(${u}, 'md')}"></th:block>
                                <span><b th:text="${u.displayName}"></b><small th:text="'@' + ${u.username}"></small></span></a></td>
                            <td class="dim" th:text="${u.email}"></td>
                            <td><span class="badge" th:classappend="${u.admin} ? 'badge-violet'" th:text="${u.admin} ? 'Админ' : 'Пользователь'"></span></td>
                            <td><span class="badge" th:classappend="${u.enabled} ? 'badge-green' : 'badge-red'" th:text="${u.enabled} ? 'Активен' : 'Заблокирован'"></span></td>
                            <td class="num" th:text="${u.subscriberCount}"></td>
                            <td class="dim" style="white-space:nowrap" th:text="${@fmt.date(u.createdAt)}"></td>
                            <td>
                                <div class="row-actions" th:if="${u.id != me.id}">
                                    <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" th:attr="data-confirm=${u.admin} ? 'Снять права администратора?' : 'Назначить администратором?'">
                                        <button class="btn btn-sm" type="submit"><i data-lucide="shield"></i><th:block th:text="${u.admin} ? 'Снять админа' : 'Сделать админом'"></th:block></button>
                                    </form>
                                    <form th:action="@{/admin/users/{id}/ban(id=${u.id})}" method="post" th:attr="data-confirm=${u.enabled} ? 'Заблокировать пользователя?' : 'Разблокировать пользователя?'">
                                        <button class="btn btn-sm" th:classappend="${u.enabled} ? 'btn-danger'" type="submit">
                                            <i th:attr="data-lucide=${u.enabled} ? 'ban' : 'circle-check'"></i><th:block th:text="${u.enabled} ? 'Блок' : 'Разблок'"></th:block></button>
                                    </form>
                                </div>
                                <span class="dim" th:if="${u.id == me.id}">это вы</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pager" th:if="${users.totalPages > 1}">
                    <a class="btn btn-sm" th:if="${users.hasPrevious()}" th:href="@{/admin/users(page=${users.number - 1},q=${q})}">Назад</a>
                    <span class="badge" th:text="${users.number + 1} + ' / ' + ${users.totalPages}"></span>
                    <a class="btn btn-sm" th:if="${users.hasNext()}" th:href="@{/admin/users(page=${users.number + 1},q=${q})}">Дальше</a>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
