<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Статистика — Studio')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div class="studio">
            <nav th:replace="~{fragments/panels :: studioNav}"></nav>
            <div>
                <div class="page-head">
                    <div>
                        <h1 class="page-title">Watch Statistics</h1>
                        <p class="page-sub">Аналитика просмотров, аудитории и вовлечённости</p>
                    </div>
                </div>
                <div class="stats-grid stagger">
                    <div class="stat-card" style="--c:#8b5cf6"><div class="ico"><i data-lucide="eye"></i></div><div class="val" th:text="${@fmt.compact(totals.views())}"></div><div class="lbl">Просмотров всего</div></div>
                    <div class="stat-card" style="--c:#3b6bff"><div class="ico"><i data-lucide="calendar-range"></i></div><div class="val" th:text="${@fmt.compact(totals.views30())}"></div><div class="lbl">За 30 дней</div></div>
                    <div class="stat-card" style="--c:#22c55e"><div class="ico"><i data-lucide="user-plus"></i></div><div class="val" th:text="'+' + ${totals.subs30()}"></div><div class="lbl">Новых подписчиков за 30 дней</div></div>
                    <div class="stat-card" style="--c:#ec4899"><div class="ico"><i data-lucide="message-circle"></i></div><div class="val" th:text="${@fmt.compact(totals.comments())}"></div><div class="lbl">Комментариев</div></div>
                </div>
                <div class="chart-card">
                    <div class="chart-head">
                        <h3>Просмотры по дням</h3>
                        <div class="segmented" data-chart-range="aViews">
                            <button type="button" data-days="7">7 дн.</button>
                            <button type="button" data-days="30" class="active">30 дн.</button>
                            <button type="button" data-days="90">90 дн.</button>
                            <button type="button" data-days="365">Год</button>
                        </div>
                    </div>
                    <div class="chart" id="aViews" data-src="/api/studio/views" data-days="30" data-color="#8b5cf6" data-color2="#3b6bff" data-unit="просмотров"></div>
                </div>
                <div class="chart-card">
                    <div class="chart-head">
                        <h3>Новые подписчики</h3>
                        <div class="segmented" data-chart-range="aSubs">
                            <button type="button" data-days="30" class="active">30 дн.</button>
                            <button type="button" data-days="90">90 дн.</button>
                        </div>
                    </div>
                    <div class="chart" id="aSubs" style="height:200px" data-src="/api/studio/subscribers" data-days="30" data-color="#22c55e" data-color2="#14b8a6" data-unit="подписчиков" data-bars="1"></div>
                </div>
                <div class="table-wrap" th:if="${!videos.isEmpty()}">
                    <table class="table">
                        <thead><tr><th>Видео</th><th class="num">Просмотры</th><th class="num">Лайки</th><th class="num">Одобрение</th><th class="num">Комментарии</th></tr></thead>
                        <tbody>
                        <tr th:each="v : ${videos}">
                            <td><a class="table-video" th:href="@{/studio/videos/{id}(id=${v.id})}"><img th:src="${v.thumbnailUrl}" alt="" loading="lazy"><span><b th:text="${v.title}"></b><small th:text="${@fmt.date(v.createdAt)}"></small></span></a></td>
                            <td class="num" th:text="${@fmt.number(v.views)}"></td>
                            <td class="num" th:text="${@fmt.number(v.likes)}"></td>
                            <td class="num"><span th:text="${v.likeRatio} + '%'"></span><div class="ratio-bar"><span th:style="'width:' + ${v.likeRatio} + '%'"></span></div></td>
                            <td class="num" th:text="${v.commentCount}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/charts.js}"></script>
</body>
</html>
