<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status != null ? status : 'Ошибка'} + ' — VYBE'">Ошибка — VYBE</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/vybe.css}">
</head>
<body>
<div class="error-page">
    <div>
        <div class="error-code" th:text="${status != null ? status : 'Упс'}">404</div>
        <h1 style="font-size:24px;margin:10px 0" th:text="${status == 404} ? 'Страница не найдена' : (${status == 403} ? 'Доступ запрещён' : (${error != null} ? ${error} : 'Что-то пошло не так'))">Ошибка</h1>
        <p class="muted" style="max-width:440px;margin:0 auto 26px" th:text="${message != null and !#strings.isEmpty(message) and message != 'No message available'} ? ${message} : 'Возможно, ссылка устарела или содержимое было удалено.'"></p>
        <div style="display:flex;gap:10px;justify-content:center">
            <a class="btn btn-primary btn-lg" th:href="@{/}">На главную</a>
            <a class="btn btn-lg" href="javascript:history.back()">Назад</a>
        </div>
    </div>
</div>
</body>
</html>
