spring.application.name=vybe
server.port=${PORT:8080}

# ---------- PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vybe}
spring.datasource.username=${DB_USER:vybe}
spring.datasource.password=${DB_PASSWORD:vybe}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2100MB
server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=10m

vybe.storage.path=${VYBE_STORAGE:./vybe-data}
vybe.ffmpeg.path=${FFMPEG_PATH:ffmpeg}
vybe.ffprobe.path=${FFPROBE_PATH:ffprobe}

# Initial administrator (created on first start if absent)
vybe.admin.username=${VYBE_ADMIN_USER:admin}
vybe.admin.email=${VYBE_ADMIN_EMAIL:admin@vybe.local}
vybe.admin.password=${VYBE_ADMIN_PASSWORD:admin12345}

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
server.servlet.session.timeout=7d
server.error.whitelabel.enabled=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
